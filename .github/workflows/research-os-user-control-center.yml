name: Research OS User Control Center

on:
  pull_request:
    paths:
      - "apps/research_os_web/**"
      - "apps/research_os_flutter/lib/src/features/control_center/**"
      - "apps/research_os_flutter/lib/src/api/research_os_api_client.dart"
      - "tools/research_os_api/server.py"
      - "tools/research_os_api/api_platform/**"
      - "tools/research_os_api/control_center_audit_store.py"
      - "tools/research_os_api/test_control_center_audit_store.py"
      - "tools/research_os_api/test_control_center_audit_http.py"
      - "apps/research_os_flutter/lib/src/features/owner/**"
      - "apps/research_os_flutter/lib/src/features/chat/**"
      - "apps/research_os_flutter/lib/src/features/projects/**"
      - "apps/research_os_flutter/lib/src/features/workflows/**"
      - "apps/research_os_flutter/lib/src/api/research_os_api_client.dart"
      - "apps/research_os_flutter/lib/src/app_shell.dart"
      - "apps/research_os_flutter/test/workflow_experience_page_test.dart"
      - "apps/research_os_flutter/test/features/control_center/**"
      - "apps/research_os_flutter/test/owner_experience_page_test.dart"
      - "tools/test_user_control_center_completion_matrix.py"
      - "current/USER_CONTROL_CENTER_COMPLETION_MATRIX.json"
      - "docs/FULL-USER-CONTROL-CENTER-COMPLETION-AUDIT.md"
      - "tools/research_os_api/test_web_control_center.py"
      - "tools/research_os_api/test_management_http_rbac.py"
      - "tools/research_os_api/test_admin_console_management.py"
      - ".github/workflows/research-os-user-control-center.yml"

permissions:
  contents: read

concurrency:
  group: research-os-user-control-center-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Validate Control Center (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node --check apps/research_os_web/app.js
      - name: Validate Control Center source contract
        run: python -m unittest tools.research_os_api.test_web_control_center tools.research_os_api.test_management_http_rbac tools.research_os_api.test_admin_console_management tools.test_user_control_center_completion_matrix -v
