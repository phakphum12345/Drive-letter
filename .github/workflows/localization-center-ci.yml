name: Localization Center CI

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/localization_center/**"
      - "tools/validate_localization_catalogs.py"
      - "tools/test_validate_localization_catalogs.py"
      - ".github/workflows/localization-center-ci.yml"

permissions:
  contents: read

concurrency:
  group: localization-center-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localization-center:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run localization catalog tests
        run: python -m unittest discover -s tools -p "test_validate_localization_catalogs.py" -v

      - name: Validate sample English and Thai catalogs
        run: |
          python tools/validate_localization_catalogs.py \
            --source tools/localization_center/locales/en.json \
            --target tools/localization_center/locales/th.json
