name: Release Authority Regression Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/validate_release_authority.py"
      - "tools/test_validate_release_authority.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-authority-tests.yml"

permissions:
  contents: read

concurrency:
  group: release-authority-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Release evidence allow/deny regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile release authority validator and tests
        run: python -m py_compile tools/validate_release_authority.py tools/test_validate_release_authority.py
      - name: Run allow and deny regression cases
        run: python -m unittest tools.test_validate_release_authority -v
