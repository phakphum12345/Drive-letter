name: Research OS Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA
        required: true
        type: string

      candidate_run_id:
        description: Successful Research OS Unified Windows Distribution workflow run ID
        required: true
        type: string

      final_gate_run_id:
        description: Successful Research OS Unified Final Gate workflow run ID
        required: true
        type: string

      spine_run_id:
        description: Successful Research OS Release Spine Gate workflow run ID
        required: true
        type: string

      tag_name:
        description: Release tag, for example v3.0.0
        required: false
        type: string

      publish:
        description: Actually create a GitHub Release and tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: research-os-release-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish certified Research OS release
    runs-on: ubuntu-latest

    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SPINE_RUN_ID: ${{ inputs.spine_run_id }}
      FINAL_GATE_RUN_ID: ${{ inputs.final_gate_run_id }}

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Run release authority regression tests
        run: python -m unittest tools.test_validate_release_authority -v

      - name: Validate candidate and release spine workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validate_run() {
            local run_id="$1" expected_workflow="$2" expected_sha="$3"
            local workflow status conclusion head_sha
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            if [ -n "$expected_sha" ]; then test "$head_sha" = "$expected_sha"; fi
          }
          test -n "$TARGET_SHA"
          test -n "$CANDIDATE_RUN_ID"
          test -n "$SPINE_RUN_ID"
          test -n "$FINAL_GATE_RUN_ID"
          validate_run "$CANDIDATE_RUN_ID" "Research OS Unified Windows Distribution" "$TARGET_SHA"
          validate_run "$FINAL_GATE_RUN_ID" "Research OS Unified Final Gate" "$TARGET_SHA"
          validate_run "$SPINE_RUN_ID" "Research OS Release Spine Gate" ""
          echo "CANDIDATE_RUN_VALIDATION=PASS"
          echo "SPINE_RUN_VALIDATION=PASS"
          echo "UNIFIED_FINAL_GATE_VALIDATION=PASS"

      - name: Download exact-SHA candidate and release spine artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-input spine-input
          mkdir -p release-input spine-input
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "Research-OS-Unified-Windows-x64-$TARGET_SHA" \
            --dir release-input
          gh run download "$SPINE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "research-os-release-spine-$TARGET_SHA" \
            --dir spine-input
          find release-input spine-input -type f -print | sort

      - name: Validate immutable release authority evidence
        id: authority
        run: |
          set -euo pipefail
          spine="$(find spine-input -type f -name 'RELEASE_SPINE_CERTIFICATION.json' -print -quit)"
          test -n "$spine"
          python tools/validate_release_authority.py \
            --artifact-dir release-input \
            --spine "$spine" \
            --target-sha "$TARGET_SHA" \
            --spine-run-id "$SPINE_RUN_ID" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"
          echo "CANDIDATE_PROVENANCE_LINEAGE_CERTIFICATION=PASS"

      - name: Independently validate certified constituent workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_GATE_RUN_ID: ${{ steps.authority.outputs.research_gate_run_id }}
          PROVENANCE_RUN_ID: ${{ steps.authority.outputs.provenance_run_id }}
          LINEAGE_RUN_ID: ${{ steps.authority.outputs.lineage_run_id }}
        run: |
          set -euo pipefail
          validate_exact_run() {
            local run_id="$1" expected_workflow="$2"
            local workflow status conclusion head_sha
            test -n "$run_id"
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            test "$head_sha" = "$TARGET_SHA"
          }
          validate_exact_run "$RESEARCH_GATE_RUN_ID" "Research OS Gate"
          validate_exact_run "$PROVENANCE_RUN_ID" "Provenance Evidence Gate"
          validate_exact_run "$LINEAGE_RUN_ID" "Canonical Source Lineage Gate"
          echo "RELEASE_SPINE_CONSTITUENT_RUNS=PASS"

      - name: Upload release-ready artifact and certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-os-release-ready-${{ env.TARGET_SHA }}
          path: |
            release-input/**
            spine-input/**
          if-no-files-found: error
          retention-days: 30

      - name: Validate release metadata
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag_name }}"

          if [ -z "$tag" ]; then
            tag="research-os-${TARGET_SHA:0:12}"
          fi

          echo "Release tag: $tag"

          case "$tag" in
            refs/*)
              echo "Invalid release tag: $tag"
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ inputs.publish == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setup="$(find release-input -type f -name 'Research-OS-Owner-Special-Setup-*-x64.exe' -print -quit)"
          archive="$(find release-input -type f -name "Research-OS-Platform-Windows-x64-$TARGET_SHA.zip" -print -quit)"
          manifest="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.json' -print -quit)"
          manifest_hash="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.sha256' -print -quit)"
          release_evidence="$(find release-input -type f -name 'RELEASE_EVIDENCE.json' -print -quit)"
          install_evidence="$(find release-input -type f -name 'WINDOWS_INSTALL_E2E_EVIDENCE.json' -print -quit)"
          certification="$(find spine-input -type f -name 'RELEASE_SPINE_CERTIFICATION.json' -print -quit)"
          for file in "$setup" "$archive" "$manifest" "$manifest_hash" "$release_evidence" "$install_evidence" "$certification"; do test -n "$file"; done
          gh release create "$RELEASE_TAG" \
            "$setup" "$archive" "$manifest" "$manifest_hash" \
            "$release_evidence" "$install_evidence" "$certification" \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "Research OS $RELEASE_TAG" \
            --notes "Certified Research OS Unified Windows candidate $TARGET_SHA. Certification, provenance, lineage and Windows installation evidence are attached."

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Research OS Release"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
            if [ -n "${RELEASE_TAG:-}" ]; then
              echo "- Release tag: \`$RELEASE_TAG\`"
            fi
            echo
            echo "Unified Windows candidate, installer SHA256, Windows installation evidence, and immutable release spine certification were verified."
          } >> "$GITHUB_STEP_SUMMARY"
