name: Research OS Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA
        required: true
        type: string

      candidate_run_id:
        description: Legacy V3 Candidate run ID passed by Generate Orchestrator; compatibility-only and ignored for release binding
        required: false
        type: string

      distribution_run_id:
        description: Optional successful Research OS Unified Windows Distribution run ID override
        required: false
        type: string

      final_gate_run_id:
        description: Successful Research OS Unified Final Gate workflow run ID
        required: false
        type: string

      spine_run_id:
        description: Successful Research OS Release Spine Gate workflow run ID
        required: false
        type: string

      tag_name:
        description: Release tag, for example v3.0.0
        required: false
        type: string

      publish:
        description: Actually create a GitHub Release and tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: research-os-release-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish certified Research OS release
    runs-on: ubuntu-latest

    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.distribution_run_id }}
      LEGACY_V3_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SPINE_RUN_ID: ${{ inputs.spine_run_id }}
      FINAL_GATE_RUN_ID: ${{ inputs.final_gate_run_id }}

    steps:
      - name: Checkout trusted release tooling from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify trusted tooling checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          echo "RELEASE_WORKFLOW_REF=main"
          echo "TRUSTED_RELEASE_TOOLING_REF=main"

      - name: Verify target SHA belongs to canonical main history
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" main
          echo "CANONICAL_MAIN_TARGET_SHA=PASS"

      - name: Run release authority regression tests
        run: python -m unittest tools.test_validate_release_authority -v

      - name: Validate candidate and release spine workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validate_run() {
            local run_id="$1" expected_workflow="$2" expected_sha="$3"
            local workflow status conclusion head_sha
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            if [ -n "$expected_sha" ]; then test "$head_sha" = "$expected_sha"; fi
          }
          test -n "$TARGET_SHA"
          resolve_run() {
            local supplied="$1" expected_workflow="$2" found=""
            if [ -n "$supplied" ]; then printf '%s' "$supplied"; return 0; fi
            for attempt in $(seq 1 10); do
              found="$(gh run list --repo "${{ github.repository }}" --workflow "$expected_workflow" --commit "$TARGET_SHA" --limit 50 --json databaseId,status,conclusion,headSha | jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | .[0].databaseId // empty')"
              if [ -n "$found" ]; then printf '%s' "$found"; return 0; fi
              if [ "$attempt" -lt 10 ]; then sleep 15; fi
            done
            echo "No completed successful exact-SHA run found for $expected_workflow ($TARGET_SHA)" >&2
            return 1
          }
          CANDIDATE_RUN_ID="$(resolve_run "$CANDIDATE_RUN_ID" "Research OS Unified Windows Distribution")"
          FINAL_GATE_RUN_ID="$(resolve_run "$FINAL_GATE_RUN_ID" "Research OS Unified Final Gate")"
          SPINE_RUN_ID="$(resolve_run "$SPINE_RUN_ID" "Research OS Release Spine Gate")"
          {
            echo "CANDIDATE_RUN_ID=$CANDIDATE_RUN_ID"
            echo "FINAL_GATE_RUN_ID=$FINAL_GATE_RUN_ID"
            echo "SPINE_RUN_ID=$SPINE_RUN_ID"
          } >> "$GITHUB_ENV"
          validate_run "$CANDIDATE_RUN_ID" "Research OS Unified Windows Distribution" "$TARGET_SHA"
          validate_run "$FINAL_GATE_RUN_ID" "Research OS Unified Final Gate" "$TARGET_SHA"
          validate_run "$SPINE_RUN_ID" "Research OS Release Spine Gate" ""
          echo "CANDIDATE_RUN_VALIDATION=PASS"
          echo "SPINE_RUN_VALIDATION=PASS"
          echo "UNIFIED_FINAL_GATE_VALIDATION=PASS"

      - name: Download exact-SHA candidate and release spine artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-input spine-input
          mkdir -p release-input spine-input
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "Research-OS-Unified-Windows-x64-$TARGET_SHA" \
            --dir release-input
          gh run download "$SPINE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "research-os-release-spine-$TARGET_SHA" \
            --dir spine-input
          find release-input spine-input -type f -print | sort

      - name: Resolve certified constituent workflow run references
        id: authority
        run: |
          set -euo pipefail
          spine="$(find spine-input -type f -name 'RELEASE_SPINE_CERTIFICATION.json' -print -quit)"
          test -n "$spine"
          python - "$spine" "$TARGET_SHA" "$SPINE_RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          path, target, run_id, output = sys.argv[1:]
          data = json.loads(Path(path).read_text(encoding="utf-8-sig"))
          if data.get("commit") != target or str(data.get("run_id")) != run_id:
              raise SystemExit("release spine target/run identity mismatch")
          refs = data.get("run_refs", {})
          for key in ("research_gate", "provenance", "lineage"):
              value = str(refs.get(key, ""))
              if not value.isdigit():
                  raise SystemExit(f"missing certified run reference: {key}")
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write(f"{key}_run_id={value}\n")
          PY

      - name: Independently validate certified constituent workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_GATE_RUN_ID: ${{ steps.authority.outputs.research_gate_run_id }}
          PROVENANCE_RUN_ID: ${{ steps.authority.outputs.provenance_run_id }}
          LINEAGE_RUN_ID: ${{ steps.authority.outputs.lineage_run_id }}
        run: |
          set -euo pipefail
          validate_exact_run() {
            local run_id="$1" expected_workflow="$2"
            local workflow status conclusion head_sha
            test -n "$run_id"
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            test "$head_sha" = "$TARGET_SHA"
          }
          validate_exact_run "$RESEARCH_GATE_RUN_ID" "Research OS Gate"
          validate_exact_run "$PROVENANCE_RUN_ID" "Provenance Evidence Gate"
          validate_exact_run "$LINEAGE_RUN_ID" "Canonical Source Lineage Gate"
          echo "RELEASE_SPINE_CONSTITUENT_RUNS=PASS"

      - name: Download exact-SHA target-bound provenance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_RUN_ID: ${{ steps.authority.outputs.provenance_run_id }}
        run: |
          set -euo pipefail
          mkdir -p provenance-input
          gh run download "$PROVENANCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "target-bound-provenance-$PROVENANCE_RUN_ID" \
            --dir provenance-input
          find provenance-input -type f -print | sort

      - name: Validate immutable release, provenance, and Owner identity evidence
        run: |
          set -euo pipefail
          spine="$(find spine-input -type f -name 'RELEASE_SPINE_CERTIFICATION.json' -print -quit)"
          test -n "$spine"
          python tools/validate_release_authority.py \
            --artifact-dir release-input \
            --spine "$spine" \
            --target-sha "$TARGET_SHA" \
            --spine-run-id "$SPINE_RUN_ID" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --provenance-dir provenance-input \
            --provenance-run-id "${{ steps.authority.outputs.provenance_run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          echo "CANDIDATE_PROVENANCE_LINEAGE_CERTIFICATION_OWNER_IDENTITY=PASS"

      - name: Upload release-ready artifact and certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-os-release-ready-${{ env.TARGET_SHA }}
          path: |
            release-input/**
            spine-input/**
            provenance-input/**
          if-no-files-found: error
          retention-days: 30

      - name: Validate release metadata
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag_name }}"

          if [ -z "$tag" ]; then
            tag="research-os-${TARGET_SHA:0:12}"
          fi

          echo "Release tag: $tag"

          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ inputs.publish == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setup="$(find release-input -type f -name 'Research-OS-Owner-Special-Setup-*-x64.exe' -print -quit)"
          archive="$(find release-input -type f -name "Research-OS-Platform-Windows-x64-$TARGET_SHA.zip" -print -quit)"
          archive_hash="$(find release-input -type f -name "Research-OS-Platform-Windows-x64-$TARGET_SHA.zip.sha256" -print -quit)"
          manifest="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.json' -print -quit)"
          manifest_hash="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.sha256' -print -quit)"
          release_evidence="$(find release-input -type f -name 'RELEASE_EVIDENCE.json' -print -quit)"
          install_evidence="$(find release-input -type f -name 'WINDOWS_INSTALL_E2E_EVIDENCE.json' -print -quit)"
          certification="$(find spine-input -type f -name 'RELEASE_SPINE_CERTIFICATION.json' -print -quit)"
          provenance_evidence="$(find provenance-input -type f -name 'TARGET_BOUND_EVIDENCE.json' -print -quit)"
          provenance_ledger="$(find provenance-input -type f -name 'TARGET_BOUND_PROVENANCE.json' -print -quit)"
          provenance_roots="$(find provenance-input -type f -name 'TARGET_BOUND_ROOTS.json' -print -quit)"
          provenance_verification="$(find provenance-input -type f -name 'TARGET_BOUND_VERIFICATION.json' -print -quit)"
          for file in "$setup" "$archive" "$archive_hash" "$manifest" "$manifest_hash" "$release_evidence" "$install_evidence" "$certification" "$provenance_evidence" "$provenance_ledger" "$provenance_roots" "$provenance_verification"; do test -n "$file"; done
          gh release create "$RELEASE_TAG" \
            "$setup" "$archive" "$archive_hash" "$manifest" "$manifest_hash" \
            "$release_evidence" "$install_evidence" "$certification" \
            "$provenance_evidence" "$provenance_ledger" "$provenance_roots" "$provenance_verification" \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "Research OS $RELEASE_TAG" \
            --notes "Certified Research OS Unified Windows candidate $TARGET_SHA. Certification, provenance, lineage and Windows installation evidence are attached."

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Research OS Release"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
            if [ -n "${RELEASE_TAG:-}" ]; then
              echo "- Release tag: \`$RELEASE_TAG\`"
            fi
            echo
            echo "Unified Windows candidate, installer SHA256, Windows installation evidence, and immutable release spine certification were verified."
          } >> "$GITHUB_STEP_SUMMARY"
