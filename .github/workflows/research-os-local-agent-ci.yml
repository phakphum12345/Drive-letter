name: Research OS Windows Local Agent

on:
  pull_request:
    paths:
      - "tools/research_os_agent/**"
      - "scripts/research-os-agent-service.ps1"
      - "tools/test_research_os_agent.py"
      - ".github/workflows/research-os-local-agent-ci.yml"

permissions:
  contents: read

concurrency:
  group: research-os-local-agent-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Local Agent safety contract
        run: python -m unittest tools.test_research_os_agent -v

  windows-build:
    needs: source-safety
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - name: Build and publish Windows Local Agent
        shell: pwsh
        run: |
          dotnet publish tools/research_os_agent/ResearchOS.LocalAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o phase-agent/agent_service
          if ($LASTEXITCODE -ne 0) { throw 'Local Agent publish failed.' }
          if (-not (Test-Path 'phase-agent/agent_service/ResearchOS.LocalAgent.exe')) { throw 'Local Agent executable missing.' }
      - name: Assemble standalone Agent package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phase-agent/scripts | Out-Null
          Copy-Item scripts/research-os-agent-service.ps1 phase-agent/scripts/
          Copy-Item tools/research_os_agent/README.md phase-agent/README.md
          Compress-Archive -Path phase-agent/agent_service,phase-agent/scripts,phase-agent/README.md -DestinationPath ResearchOS-LocalAgent-win-x64.zip -Force
          Get-FileHash ResearchOS-LocalAgent-win-x64.zip -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ResearchOS-LocalAgent-win-x64
          path: ResearchOS-LocalAgent-win-x64.zip
          if-no-files-found: error
          retention-days: 14
