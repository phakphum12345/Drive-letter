name: Research OS GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/research_os_web/**"
      - ".github/workflows/research-os-github-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/research_os_web/**"
      - ".github/workflows/research-os-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-os-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package static Research OS web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate static site inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/research_os_web/index.html
          test -s apps/research_os_web/app.css
          test -s apps/research_os_web/app.js
          test -s apps/research_os_web/login.html
          test -s apps/research_os_web/login.css
          grep -q 'href="./app.css"' apps/research_os_web/index.html
          grep -q 'src="./app.js"' apps/research_os_web/index.html
          grep -q 'href="./login.css"' apps/research_os_web/login.html
          echo "RESEARCH_OS_STATIC_SITE_INPUTS=PASS"

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R apps/research_os_web/. _site/
          test -s _site/index.html
          test -s _site/app.css
          test -s _site/app.js
          # Match the archive layout expected by actions/deploy-pages.
          tar --dereference --hard-dereference -cvf artifact.tar -C _site .
          test -s artifact.tar
          echo "RESEARCH_OS_PAGES_ARTIFACT=PASS"

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy Research OS GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
