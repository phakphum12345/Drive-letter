name: Research OS Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to validate"
        required: false
        type: string

permissions:
  contents: read

# Do not cancel an in-flight final gate when another push/commit arrives.
# The gate must finish its required jobs so a cancelled child job is not
# misreported as a final-gate failure caused by concurrency cancellation.
concurrency:
  group: research-os-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}

jobs:
  python-quality:
    name: Python Build Test Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3

      - name: Unit tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Import smoke
        env:
          PYTHONPATH: v3
        run: |
          python -c "import research_os_v3; print('research_os_v3 import: OK')"

      - name: Static analysis
        env:
          PYTHONPATH: v3
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('v3/research_os_v3')
          files = sorted(root.glob('*.py'))
          assert files, 'no Research OS Python sources found'
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'AST analysis passed: {len(files)} files')
          PY

  research-e2e:
    name: Research E2E
    needs: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Research OS E2E tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest discover -s v3/tests -p 'test_*e2e*.py' -v

      - name: Run autonomous/evidence integration tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest \
            v3.tests.test_autonomous_research \
            v3.tests.test_tool_evidence \
            v3.tests.test_research_tool_adapters \
            -v

  flutter-quality:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Download and set up Flutter SDK
        uses: ./.github/actions/flutter-setup # vendored composite; nested actions pinned
        with:
          channel: stable
          cache: true

      # Recon runs immediately after SDK setup and before project generation,
      # dependency resolution, analysis, tests, or APK compilation.
      - name: Recon downloaded SDK and Android build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RECON: SDK IDENTITY ==="
          flutter --version
          dart --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "flutter-version.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          for key in ("frameworkVersion", "channel", "repositoryUrl", "frameworkRevision", "dartSdkVersion"):
              print(f"FLUTTER_RECON_{key.upper()}={data.get(key, 'UNKNOWN')}")
          assert data.get("frameworkRevision"), "Flutter framework revision is missing"
          assert data.get("dartSdkVersion"), "Dart SDK version is missing"
          PY

          echo "=== RECON: JAVA ==="
          java -version
          command -v java
          echo "JAVA_HOME=${JAVA_HOME:-UNSET}"

          echo "=== RECON: ANDROID SDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-UNSET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          doctor_status=0
          flutter doctor -v > "$RUNNER_TEMP/flutter-doctor.log" 2>&1 || doctor_status=$?
          cat "$RUNNER_TEMP/flutter-doctor.log"
          echo "FLUTTER_DOCTOR_EXIT_CODE=$doctor_status"
          # Doctor also checks unrelated desktop toolchains (GTK/CMake/etc.).
          # Do not fail an Android build merely because Linux desktop support is absent.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platform-tools"
          test -d "$sdk_root/platforms"
          echo "RECON_ANDROID_SDK_LAYOUT=PASS"

          echo "=== RECON: PROJECT INPUTS ==="
          test -f v3/flutter_app/pubspec.yaml
          test -f v3/flutter_app/android/settings.gradle.kts
          test -f v3/flutter_app/android/gradle/wrapper/gradle-wrapper.properties
          echo "RECON_PROJECT_INPUTS=PASS"

          echo "=== RECON: MAVEN CENTRAL REACHABILITY ==="
          url="https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.21/kotlin-stdlib-2.2.21.pom"
          status="$(curl --silent --show-error --location --output "$RUNNER_TEMP/kotlin-stdlib.pom" --write-out '%{http_code}' --max-time 30 "$url")"
          echo "MAVEN_CENTRAL_HTTP_STATUS=$status"
          if [[ "$status" != 2* ]]; then
            echo "::error::Maven Central dependency probe failed with HTTP $status; SDK setup succeeded but Gradle dependency downloads may not work."
            exit 1
          fi
          test -s "$RUNNER_TEMP/kotlin-stdlib.pom"
          echo "RECON_MAVEN_CENTRAL=PASS"
          echo "FLUTTER_POST_DOWNLOAD_RECON=PASS"

      - name: Generate Android platform
        working-directory: v3/flutter_app
        run: flutter create --platforms=android --project-name=research_os_v3_flutter .

      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze

      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test

      - name: Flutter debug APK build
        working-directory: v3/flutter_app
        run: flutter build apk --debug

  gate:
    name: Research OS Final Gate
    needs: [python-quality, research-e2e, flutter-quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "python-quality=${{ needs.python-quality.result }}"
          echo "research-e2e=${{ needs.research-e2e.result }}"
          echo "flutter-quality=${{ needs.flutter-quality.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.research-e2e.result }}" = success
          test "${{ needs.flutter-quality.result }}" = success
          echo "RESEARCH_OS_GATE=PASS"
