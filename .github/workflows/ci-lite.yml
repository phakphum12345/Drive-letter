name: Research OS CI Lite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to validate
        required: false
        type: string
      include_flutter:
        description: Also run Flutter analyze and tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: research-os-ci-lite-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      RESEARCH_OS_PROVIDER: mock
      RESEARCH_OS_SYNC_KEY: ci-lite-test-key
      RESEARCH_OS_ALLOW_LEGACY_IDENTITY_HEADERS: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile API modules
        run: |
          python -m compileall -q tools/research_os_api tools/research_curator

      - name: Run API unit tests
        run: |
          export RESEARCH_OS_DATA_DIR="$RUNNER_TEMP/ResearchOSData"
          export RESEARCH_OS_CONVERSATION_STORE="$RUNNER_TEMP/ResearchOSData/sessions/conversations.json"
          python -m unittest discover -s tools/research_os_api -p "test_*.py" -v

      - name: Run Recon concurrency regression test
        run: python -m unittest tools.test_recon_concurrency -v

      - name: Set up Flutter
        if: ${{ inputs.include_flutter == true }}
        uses: ./.github/actions/flutter-setup # vendored composite; nested actions pinned
        with:
          channel: stable
          cache: true

      - name: Flutter analyze and tests
        if: ${{ inputs.include_flutter == true }}
        working-directory: apps/research_os_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
