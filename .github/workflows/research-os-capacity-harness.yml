name: Research OS Capacity Harness

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research_os_capacity_metrics.py'
      - 'tools/research_os_capacity_harness.py'
      - 'tools/test_research_os_capacity_metrics.py'
      - 'docs/RESEARCH_OS_CAPACITY_HARNESS.md'
      - '.github/workflows/research-os-capacity-harness.yml'
  push:
    branches:
      - 'feat/research-os-capacity-harness-20261026'
    paths:
      - 'tools/research_os_capacity_metrics.py'
      - 'tools/research_os_capacity_harness.py'
      - 'tools/test_research_os_capacity_metrics.py'
      - 'docs/RESEARCH_OS_CAPACITY_HARNESS.md'
      - '.github/workflows/research-os-capacity-harness.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-capacity-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  metrics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile candidate
        run: python -m py_compile tools/research_os_capacity_metrics.py tools/research_os_capacity_harness.py tools/test_research_os_capacity_metrics.py
      - name: Run deterministic metrics tests
        run: python -m unittest tools.test_research_os_capacity_metrics -v
      - name: Validate CLI safety bounds
        shell: bash
        run: |
          set -euo pipefail
          python tools/research_os_capacity_harness.py --help
          if python tools/research_os_capacity_harness.py --url http://127.0.0.1:1/health --requests 0 --output "$RUNNER_TEMP/invalid.json"; then
            echo "Invalid workload unexpectedly succeeded" >&2
            exit 1
          fi
